// Gradle build (equivalent of pom.xml). Maven is used as a fallback in build.sh when Gradle is not installed.
plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
repositories { mavenCentral() }
tasks.withType(JavaCompile) { options.release = 17 }
dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
}
shadowJar { archiveBaseName = 'mope-server'; archiveClassifier = ''; archiveVersion = ''; manifest { attributes 'Main-Class': 'mope.GameServer' } }
