<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mope.io Historical Evolution</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="menuBg"></canvas>
  <div id="menuUI"><input id="nick" type="text" autocomplete="off" spellcheck="false"><button id="play" type="button"></button></div>
  <div id="devbar"><label>Historical version: <select id="versionSelect"></select></label><span id="versionLabel"></span></div>
  <div id="status"></div>
  <div id="death"><div id="deathBox"><h2>Game over</h2><p id="deathText"></p><button id="respawn" type="button">Back to menu</button></div></div>
  <script src="interpolation.js"></script>
  <script src="camera.js"></script>
  <script src="input.js"></script>
  <script src="networking.js"></script>
  <script src="sprites.js"></script>
  <script src="ui/MenuVersionManager.js"></script>
  <script src="ui/MenuRenderer.js"></script>
  <script src="ui/MenuAnimations.js"></script>
  <script src="ui/MainMenu.js"></script>
  <script src="ui/UpgradeMenu.js"></script>
  <script src="ui/Leaderboard.js"></script>
  <script src="ui/HUD.js"></script>
  <script src="ui/Settings.js"></script>
  <script src="ui/Shop.js"></script>
  <script src="renderer.js"></script>
  <script src="client.js"></script>
</body>
</html>
